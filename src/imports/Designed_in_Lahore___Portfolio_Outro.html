<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Designed in Lahore – Portfolio Outro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#B9553C; --marble:#F6F1E7; --glow:#FFC766; --cream:#FFE9C7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#070b1f;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#070b1f}
.layer{position:absolute;inset:0}

/* ---- sky ---- */
#night{background:linear-gradient(#050818 0%,#10163b 45%,#26235a 100%)}
#dawn{background:linear-gradient(#18205a 0%,#5b3a86 30%,#d9607c 58%,#ff9a4d 80%,#ffd08a 100%);opacity:0}
.play #dawn{animation:in 6.5s ease-in-out .8s forwards}
@keyframes in{to{opacity:1}}
#stars{opacity:1}
#stars circle{fill:#fff;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.play #stars{animation:out 4.5s ease-in 2.4s forwards}
@keyframes out{to{opacity:0}}
.cloud{position:absolute;border-radius:50%;filter:blur(16px);opacity:0;background:rgba(255,170,150,.55)}
.play .cloud{animation:cl 14s linear 3s forwards}
@keyframes cl{0%{opacity:0;transform:translateX(0)}20%{opacity:.7}100%{opacity:.5;transform:translateX(90px)}}
#haze{position:absolute;left:0;right:0;top:380px;height:260px;background:linear-gradient(transparent,rgba(255,170,90,.55) 80%,rgba(255,200,120,.7));opacity:0}
.play #haze{animation:in 5s ease 2.5s forwards}
#sun{position:absolute;left:650px;top:390px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#FFF4CF 0 38%,#FFD27A 62%,rgba(255,180,90,0) 72%);box-shadow:0 0 120px 60px rgba(255,170,80,.45);transform:translateY(260px);opacity:0}
.play #sun{animation:sun 7s cubic-bezier(.2,.7,.2,1) .6s forwards}
@keyframes sun{0%{opacity:0;transform:translateY(260px)}20%{opacity:1}100%{opacity:1;transform:translateY(0)}}

/* ---- ground ---- */
#ground{position:absolute;left:0;right:0;top:625px;height:95px;background:linear-gradient(#5a2c1f,#2a130d 60%,#170a07)}
#ground::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 90px)}

/* ---- buildings ---- */
.bld{position:absolute;inset:0;width:100%;height:100%;filter:brightness(.2) saturate(.7);clip-path:inset(100% 0 0 0)}
.play #mosque{animation:rise 2.8s cubic-bezier(.2,.75,.2,1) 1.4s forwards,bright 6.5s ease-in-out 1s forwards}
.play #minar{animation:rise 3.4s cubic-bezier(.2,.75,.2,1) 2.4s forwards,bright 6.5s ease-in-out 1s forwards}
@keyframes rise{to{clip-path:inset(-2% 0 0 0)}}
@keyframes bright{to{filter:brightness(1) saturate(1)}}
.lit{opacity:0}
.play .lit{animation:lit 1.8s ease 6.6s forwards}
@keyframes lit{to{opacity:.8}}
#beacon{animation:beacon 1.6s ease-in-out infinite alternate}
@keyframes beacon{from{opacity:.35}to{opacity:1}}

/* ---- birds ---- */
.bird{position:absolute;left:-60px;opacity:0}
.bird svg{display:block;transform-origin:50% 100%;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.play .bird{animation:fly var(--dur) linear var(--d) forwards}
@keyframes fly{0%{opacity:0;transform:translateX(0)}8%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateX(1400px)}}

/* ---- text ---- */
.txt{position:absolute;color:#fff}
#name{left:90px;top:52px;font-size:76px;font-weight:800;letter-spacing:-2.4px;line-height:1.05;text-shadow:0 4px 34px rgba(20,10,40,.45)}
#role{left:94px;top:142px;font-size:25px;font-weight:500;color:var(--cream);text-shadow:0 2px 18px rgba(20,10,40,.5)}
#chip{left:94px;top:186px;display:inline-flex;align-items:center;gap:10px;padding:9px 18px 9px 14px;border-radius:26px;background:rgba(20,15,45,.34);border:1px solid rgba(255,255,255,.3);font-size:19px;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#chip svg.pin{width:22px;height:22px;transform-origin:50% 100%}
.wipe{display:inline-block;clip-path:inset(0 100% 0 0)}
.play .wipe{animation:wipe .9s cubic-bezier(.7,0,.2,1) forwards;animation-delay:var(--d)}
@keyframes wipe{to{clip-path:inset(-10% -2% -10% 0)}}
.pop{opacity:0;transform:scale(.85) translateY(10px)}
.play .pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:var(--d)}
@keyframes pop{to{opacity:1;transform:none}}
.play #chip svg.pin{animation:drop .8s cubic-bezier(.3,1.4,.5,1) 8.9s both}
@keyframes drop{0%{transform:translateY(-26px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
#urdu{left:690px;top:34px;width:290px;text-align:center;font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic","Segoe UI",serif;font-weight:700;font-size:112px;line-height:1.7;color:rgba(255,236,200,.95);text-shadow:0 4px 30px rgba(60,20,40,.5);direction:rtl}
#tag{left:0;right:0;top:658px;text-align:center;font-size:29px;font-weight:600;color:var(--cream);letter-spacing:.2px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.fadeup{opacity:0;transform:translateY(14px)}
.play .fadeup{animation:pop .8s ease forwards;animation-delay:var(--d)}

/* ---- controls ---- */
#bar{position:absolute;left:0;bottom:0;height:4px;background:var(--glow);width:0;z-index:5}
#ctl{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;z-index:9;transition:opacity .4s}
#ctl button{font:600 14px Inter,sans-serif;border:0;border-radius:22px;padding:10px 18px;background:rgba(255,255,255,.92);color:#1F2E34;cursor:pointer}
#ctl button:focus-visible{outline:3px solid #00897B;outline-offset:2px}
body.clean #ctl{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Animated sunrise over Badshahi Mosque and Minar-e-Pakistan in Lahore, with the text: Muhammad Awais, Product Designer, Lahore, Pakistan.">

  <div class="layer" id="night"></div>
  <div class="layer" id="dawn"></div>
  <svg class="layer" id="stars" viewBox="0 0 1280 720" width="1280" height="720"></svg>
  <div id="haze"></div>
  <div id="sun"></div>
  <div class="cloud" style="left:120px;top:250px;width:340px;height:46px"></div>
  <div class="cloud" style="left:760px;top:300px;width:300px;height:38px"></div>
  <div class="cloud" style="left:420px;top:210px;width:260px;height:30px"></div>

  <div class="bird" style="top:300px;--dur:9s;--d:4.6s"><svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="#2a1420" stroke-width="2" stroke-linecap="round"><path d="M1 10Q7 0 13 9Q19 0 25 10"/></svg></div>
  <div class="bird" style="top:340px;--dur:10s;--d:5.3s;transform:scale(.7)"><svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="#2a1420" stroke-width="2" stroke-linecap="round"><path d="M1 10Q7 0 13 9Q19 0 25 10"/></svg></div>
  <div class="bird" style="top:276px;--dur:8.5s;--d:5.9s;transform:scale(.85)"><svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="#2a1420" stroke-width="2" stroke-linecap="round"><path d="M1 10Q7 0 13 9Q19 0 25 10"/></svg></div>

  <div id="ground"></div>
  <svg class="bld" id="mosque" viewBox="0 0 1280 720"></svg>
  <svg class="bld" id="minar" viewBox="0 0 1280 720"></svg>

  <div class="txt" id="name"><span class="wipe" style="--d:7s" id="nm">Muhammad Awais</span></div>
  <div class="txt" id="role"><span class="wipe" style="--d:7.9s" id="rl">Product Designer · UI/UX</span></div>
  <div class="txt pop" id="chip" style="--d:8.6s">
    <svg class="pin" viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5.2 7 13 7 13s7-7.800 7-13c0-4-3-7-7-7z" fill="#FFC766"/><circle cx="12" cy="9" r="2.800" fill="#3a1a2a"/></svg>
    <svg width="28" height="19" viewBox="0 0 28 19" aria-hidden="true"><rect width="28" height="19" rx="2.500" fill="#01411C"/><rect width="7" height="19" rx="2" fill="#fff"/><circle cx="18" cy="9.500" r="5" fill="#fff"/><circle cx="19.700" cy="8.600" r="4.300" fill="#01411C"/><path d="M21.500 5.200l.8 1.900 2 .1-1.600 1.300.6 2-1.800-1.200-1.800 1.200.6-2-1.600-1.300 2-.1z" fill="#fff"/></svg>
    <span>Lahore, Pakistan</span>
  </div>
  <div class="txt pop" id="urdu" style="--d:9.3s">لاہور</div>
  <div class="txt fadeup" id="tag" style="--d:11s">Designed in Lahore. Built for the world.</div>
  <div id="bar"></div>
</div>

<div id="ctl"><button id="rp">Replay</button><button id="cl">Hide controls</button></div>

<script>
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get("name"))document.getElementById("nm").textContent=q.get("name");
  if(q.get("role"))document.getElementById("rl").textContent=q.get("role");
  var LOOP=q.has("loop"), inFrame=(window.top!==window.self);
  if(q.has("clean")||inFrame)document.body.classList.add("clean");

  /* ---- stars ---- */
  var s=7;function r(){s=(s*16807)%2147483647;return s/2147483647;}
  var st="";
  for(var i=0;i<80;i++){st+='<circle cx="'+(r()*1280).toFixed(0)+'" cy="'+(r()*360).toFixed(0)+'" r="'+(0.6+r()*1.1).toFixed(2)+'" style="animation-delay:-'+(r()*3).toFixed(2)+'s;animation-duration:'+(2+r()*2.5).toFixed(2)+'s"/>';}
  document.getElementById("stars").innerHTML=st;

  /* ---- helpers ---- */
  var SAND="#B9553C",MAR="#F6F1E7",MARD="#D9D2C3",DARK="#2B120D";
  function dome(cx,b,w,h){return "M"+(cx-w)+","+b+" C"+(cx-w*1.18)+","+(b-h*.32)+" "+(cx-w*.5)+","+(b-h*.72)+" "+cx+","+(b-h)+" C"+(cx+w*.5)+","+(b-h*.72)+" "+(cx+w*1.18)+","+(b-h*.32)+" "+(cx+w)+","+b+" Z";}
  function domeSvg(cx,b,w,h){
    return '<rect x="'+(cx-w*.86)+'" y="'+(b-6)+'" width="'+(w*1.72)+'" height="16" fill="url(#mg)"/>'+
      '<path d="'+dome(cx,b,w,h)+'" fill="url(#dg)"/>'+
      '<path d="M'+(cx-w*.5)+','+(b-h*.5)+' Q'+(cx-w*.2)+','+(b-h*.85)+' '+cx+','+(b-h+4)+'" stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round"/>'+
      '<rect x="'+(cx-1.5)+'" y="'+(b-h-26)+'" width="3" height="28" fill="#E2B85C"/><circle cx="'+cx+'" cy="'+(b-h-28)+'" r="4" fill="#E2B85C"/>';
  }
  function chhatri(tx,ty,sc){
    return '<g transform="translate('+tx+','+ty+') scale('+sc+')">'+
      '<rect x="-16" y="-6" width="32" height="6" rx="1.500" fill="'+MAR+'"/>'+
      '<rect x="-12" y="-32" width="3" height="26" fill="'+MARD+'"/><rect x="-4" y="-32" width="3" height="26" fill="'+MAR+'"/><rect x="2" y="-32" width="3" height="26" fill="'+MAR+'"/><rect x="9" y="-32" width="3" height="26" fill="'+MARD+'"/>'+
      '<path d="'+dome(0,-32,15,26)+'" fill="url(#dg)"/><rect x="-1" y="-70" width="2" height="14" fill="#E2B85C"/></g>';
  }
  function minaret(cx){
    var o='<rect x="'+(cx-24)+'" y="585" width="48" height="16" fill="#8F3D2B"/>'+
      '<polygon points="'+(cx-17)+',585 '+(cx-13)+',302 '+(cx+13)+',302 '+(cx+17)+',585" fill="url(#ng)"/>';
    [545,490,435,380,335].forEach(function(y){var hw=13+(y-302)/283*4+2;o+='<rect x="'+(cx-hw)+'" y="'+y+'" width="'+(hw*2)+'" height="7" rx="1.500" fill="'+MAR+'"/>';});
    [470,360].forEach(function(y){o+='<rect x="'+(cx-22)+'" y="'+y+'" width="44" height="8" rx="2" fill="'+MAR+'"/><rect x="'+(cx-22)+'" y="'+(y+8)+'" width="44" height="3" fill="'+MARD+'"/>';});
    o+=chhatri(cx,302,1);
    return o;
  }

  /* ---- Badshahi Mosque ---- */
  var m='<defs>'+
    '<linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9694E"/><stop offset="1" stop-color="#A24530"/></linearGradient>'+
    '<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2735A"/><stop offset="1" stop-color="#B0503A"/></linearGradient>'+
    '<linearGradient id="dg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EFE9DC"/><stop offset="1" stop-color="#C4BBA8"/></linearGradient>'+
    '<linearGradient id="mg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#D9D2C3"/></linearGradient>'+
    '<linearGradient id="ng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A24530"/><stop offset=".5" stop-color="#CF6D51"/><stop offset="1" stop-color="#8A3828"/></linearGradient>'+
    '<linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD98A"/><stop offset="1" stop-color="#FF9A3C"/></linearGradient>'+
    '</defs><g transform="translate(0,25)">';
  /* domes (behind hall) */
  m+=domeSvg(470,418,85,135)+domeSvg(305,418,58,92)+domeSvg(635,418,58,92);
  /* hall */
  m+='<rect x="190" y="430" width="560" height="155" fill="url(#sg)"/>';
  for(var x=196;x<748;x+=16){m+='<path d="M'+x+',430 v-6 l5,-9 l5,9 v6 z" fill="#C9694E"/>';}
  m+='<rect x="186" y="426" width="568" height="8" fill="'+MARD+'"/><rect x="190" y="492" width="560" height="5" fill="'+MAR+'"/><rect x="180" y="585" width="580" height="16" fill="#8F3D2B"/>';
  [232,289,346,594,651,708].forEach(function(cx){
    m+='<path d="M'+(cx-22)+',585 V520 Q'+(cx-22)+',500 '+cx+',486 Q'+(cx+22)+',500 '+(cx+22)+',520 V585 Z" fill="'+DARK+'" stroke="'+MAR+'" stroke-width="3"/>';
    m+='<path class="lit" d="M'+(cx-15)+',585 V526 Q'+(cx-15)+',512 '+cx+',501 Q'+(cx+15)+',512 '+(cx+15)+',526 V585 Z" fill="url(#lg)"/>';
    m+='<path d="M'+(cx-11)+',478 V458 Q'+(cx-11)+',447 '+cx+',440 Q'+(cx+11)+',447 '+(cx+11)+',458 V478 Z" fill="'+DARK+'" stroke="'+MAR+'" stroke-width="2"/>';
    m+='<path class="lit" d="M'+(cx-8)+',478 V460 Q'+(cx-8)+',451 '+cx+',446 Q'+(cx+8)+',451 '+(cx+8)+',460 V478 Z" fill="url(#lg)"/>';
  });
  /* pishtaq */
  m+='<rect x="395" y="392" width="150" height="193" fill="url(#pg)" stroke="'+MAR+'" stroke-width="4"/>'+
     '<rect x="395" y="392" width="150" height="12" fill="'+MAR+'"/>'+
     '<rect x="405" y="412" width="26" height="62" rx="13" fill="none" stroke="'+MAR+'" stroke-width="2.500"/><rect x="509" y="412" width="26" height="62" rx="13" fill="none" stroke="'+MAR+'" stroke-width="2.500"/>'+
     '<rect x="405" y="490" width="26" height="62" rx="13" fill="none" stroke="'+MAR+'" stroke-width="2.500"/><rect x="509" y="490" width="26" height="62" rx="13" fill="none" stroke="'+MAR+'" stroke-width="2.500"/>'+
     '<path d="M422,585 V505 Q422,468 470,430 Q518,468 518,505 V585 Z" fill="'+DARK+'" stroke="'+MAR+'" stroke-width="6"/>'+
     '<path class="lit" d="M446,585 V535 Q446,512 470,497 Q494,512 494,535 V585 Z" fill="url(#lg)"/>'+
     '<path d="M446,585 V535 Q446,512 470,497 Q494,512 494,535 V585 Z" fill="none" stroke="'+MAR+'" stroke-width="2" opacity=".8"/>';
  m+=chhatri(410,392,.85)+chhatri(530,392,.85)+chhatri(215,430,1)+chhatri(725,430,1);
  /* steps */
  m+='<rect x="385" y="585" width="170" height="8" fill="'+MAR+'"/><rect x="375" y="593" width="190" height="8" fill="'+MARD+'"/><rect x="365" y="601" width="210" height="8" fill="'+MAR+'"/>';
  /* minarets */
  m+=minaret(160)+minaret(780);
  m+='</g>';
  document.getElementById("mosque").innerHTML=m;

  /* ---- Minar-e-Pakistan ---- */
  var n='<defs>'+
    '<linearGradient id="cg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#EDE8DC"/><stop offset="1" stop-color="#B9B2A2"/></linearGradient>'+
    '<radialGradient id="uplight" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#FFC766" stop-opacity=".65"/><stop offset="1" stop-color="#FFC766" stop-opacity="0"/></radialGradient>'+
    '</defs><g transform="translate(0,25)">';
  n+='<path d="M915,600 Q915,572 940,572 H1080 Q1105,572 1105,600 Z" fill="#CFCBC1"/>'+
     '<path d="M935,572 Q935,548 958,548 H1062 Q1085,548 1085,572 Z" fill="#DAD6CC"/>'+
     '<path d="M955,548 Q955,526 978,526 H1042 Q1065,526 1065,548 Z" fill="#E5E2D9"/>';
  [928,947,966].forEach(function(x,i){});
  n+='<polygon points="990,526 997,158 1010,148 1010,526" fill="#F3F0E8"/><polygon points="1010,148 1023,158 1030,526 1010,526" fill="#C9C4B7"/>'+
     '<line x1="1002" y1="526" x2="1003" y2="160" stroke="#000" stroke-opacity=".08" stroke-width="2"/><line x1="1018" y1="526" x2="1017" y2="160" stroke="#000" stroke-opacity=".1" stroke-width="2"/>'+
     '<rect x="982" y="182" width="56" height="9" rx="3" fill="#D9D2C3"/><rect x="986" y="174" width="48" height="8" rx="3" fill="#EFEADF"/>'+
     '<path d="M985,176 C960,146 974,108 1010,58 C1046,108 1060,146 1035,176 Z" fill="url(#cg)"/>'+
     '<path d="M1010,58 C1000,104 994,140 999,176" fill="none" stroke="#B9B2A2" stroke-width="2"/><path d="M1010,58 C1020,104 1026,140 1021,176" fill="none" stroke="#B9B2A2" stroke-width="2"/><line x1="1010" y1="58" x2="1010" y2="176" stroke="#A39C8B" stroke-width="1.500"/>'+
     '<line x1="1010" y1="58" x2="1010" y2="36" stroke="#C9C4B7" stroke-width="3"/><circle id="beacon" cx="1010" cy="34" r="5" fill="#FF5A4D"/>';
  n+='<ellipse class="lit" cx="1010" cy="602" rx="150" ry="44" fill="url(#uplight)"/>';
  n+='</g>';
  document.getElementById("minar").innerHTML=n;

  /* ---- fit + timeline ---- */
  var stage=document.getElementById("stage"),bar=document.getElementById("bar"),END=14.5,t0=0,raf=null;
  function fit(){var k=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform="scale("+k+") translate(-50%,-50%)";}
  addEventListener("resize",fit);fit();
  function tick(now){
    var e=(now-t0)/1000;
    bar.style.width=Math.min(100,e/END*100)+"%";
    if(e<END+(LOOP?3:0)){raf=requestAnimationFrame(tick);}
    else if(LOOP){replay();}
  }
  function replay(){
    cancelAnimationFrame(raf);
    stage.classList.remove("play");void stage.offsetWidth;stage.classList.add("play");
    t0=performance.now();raf=requestAnimationFrame(tick);
  }
  document.getElementById("rp").onclick=replay;
  document.getElementById("cl").onclick=function(){document.body.classList.add("clean");};
  addEventListener("keydown",function(e){
    if(e.key==="r"||e.key==="R")replay();
    if(e.key==="h"||e.key==="H"||e.key==="Escape")document.body.classList.toggle("clean");
  });
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(replay,150);});
})();
</script>
</body>
</html>
